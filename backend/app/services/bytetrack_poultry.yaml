# ByteTrack tracker configuration tailored for heavy poultry occlusion
tracker_type: bytetrack
track_thresh: 0.15      # Lower detection threshold to capture partially blocked/occluded chickens
match_thresh: 0.7       # Higher threshold for Hungarian matching to link low-conf detections to tracks
track_buffer: 90        # Retain lost track history for 90 frames (3 seconds) to survive feeder/bird blocking
frame_rate: 30
